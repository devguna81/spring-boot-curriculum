name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 브랜치에서 새 실행이 시작되면 이전 실행은 취소한다. main은 항상 끝까지 돌린다.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # 빌드 캐시를 쓰지 않아 모든 모듈의 테스트를 매번 실행한다.
      # Oracle이 필요한 테스트는 ORACLE_URL이 없으면 건너뛴다. 아래 oracle 잡이 따로 실행한다.
      - name: Build and test
        run: ./gradlew clean build --no-daemon --no-build-cache

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore

  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # 일회용 Oracle 컨테이너. 비밀번호는 실행할 때마다 무작위로 만들어 로그에 가린다.
      - name: Start Oracle
        run: |
          SYS_PW=$(openssl rand -hex 12)
          APP_PW=$(openssl rand -hex 12)
          echo "::add-mask::$SYS_PW"
          echo "::add-mask::$APP_PW"
          echo "ORACLE_USERNAME=curriculum" >> "$GITHUB_ENV"
          echo "ORACLE_PASSWORD=$APP_PW" >> "$GITHUB_ENV"
          echo "ORACLE_URL=jdbc:oracle:thin:@//localhost:1521/FREEPDB1" >> "$GITHUB_ENV"
          docker run -d --name oracle -p 1521:1521 \
            -e ORACLE_PASSWORD="$SYS_PW" -e APP_USER=curriculum -e APP_USER_PASSWORD="$APP_PW" \
            --health-cmd healthcheck.sh --health-interval 10s --health-timeout 5s --health-retries 30 \
            gvenzl/oracle-free:23-slim-faststart

      - name: Wait for Oracle
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' oracle)
            echo "oracle: $status"
            [ "$status" = "healthy" ] && exit 0
            sleep 10
          done
          docker logs oracle | tail -50
          exit 1

      - name: Oracle tests
        run: >
          ./gradlew --no-daemon --no-build-cache --no-parallel
          :examples:ch13-oracle-connection:test
          :examples:ch14-oracle-json:test
          :examples:ch15-json-typehandler:test

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-test-reports
          path: '**/build/reports/tests/test'
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - examples/ch21-react-basics
          - examples/ch22-react-rest/frontend
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run build
