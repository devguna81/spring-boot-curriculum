spring:
  application:
    name: ch36-bulk-orchestration
  datasource:
    url: jdbc:h2:mem:ch36-${random.uuid}
    username: sa
    password: ""
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 가변 IN 한 번에 넘길 값의 최대 개수. DB마다 허용하는 개수가 다르므로 설정으로 둔다.
bulk:
  in-chunk-size: 500
  batch-chunk-size: 100
