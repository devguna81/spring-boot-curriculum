spring:
  application:
    name: final-project
  datasource:
    url: jdbc:h2:mem:final-${random.uuid}
    username: sa
    password: ""
  sql:
    init:
      # H2용 스크립트(schema-h2.sql)만 읽는다. Oracle용은 oracle 프로파일에서 따로 실행한다.
      platform: h2

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 값이 null일 때 드라이버에 알려 줄 JDBC 타입. 기본값(OTHER)은 Oracle 드라이버가 받아들이지 못한다(ch15).
    jdbc-type-for-null: "NULL"
  global-config:
    banner: false

app:
  # true면 시작할 때 데모 계정(admin, alice, bob)과 글을 만든다. 기본은 꺼짐.
  seed-demo-data: ${SEED_DEMO_DATA:false}
  # 데모 계정의 비밀번호. 기본값이 없다. SEED_DEMO_DATA=true일 때 DEMO_PASSWORD로 직접 지정한다.
  demo-password: ${DEMO_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        # 필요한 것만 연다. env, beans 같은 민감한 정보는 열지 않는다.
        include: health,info,metrics
  endpoint:
    health:
      # 상태(UP/DOWN)만 공개하고 DB 같은 세부 항목은 관리자에게만 보인다.
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true
