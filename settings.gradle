pluginManagement {
    plugins {
        id 'org.springframework.boot' version "${springBootVersion}"
        id 'io.spring.dependency-management' version "${dependencyManagementVersion}"
    }
}

rootProject.name = 'spring-boot-curriculum'

// 예제는 챕터가 추가될 때마다 한 줄씩 늘린다.
include 'examples:ch01-hello-spring'
include 'examples:ch02-config-profile'
include 'examples:ch03-ioc-di-bean'
include 'examples:ch04-rest-controller'
include 'examples:ch05-crud-api'
include 'examples:ch06-validation'
