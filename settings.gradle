include 'examples:ch03-ioc-di-bean'
include 'examples:ch04-rest-controller'
include 'examples:ch05-crud-api'
include 'examples:ch06-validation'
include 'examples:ch07-exception-handling'
include 'examples:ch08-datasource-h2'
include 'examples:ch09-mybatis-basics'
include 'examples:ch10-dynamic-sql'
include 'examples:ch11-transaction'
include 'examples:ch12-mybatis-plus'
include 'examples:ch13-oracle-connection'
include 'examples:ch14-oracle-json'
include 'examples:ch15-json-typehandler'
include 'examples:ch16-mapstruct'
include 'examples:ch17-openapi'
include 'examples:ch18-api-contract'
include 'examples:ch19-thymeleaf'
include 'examples:ch20-thymeleaf-crud'
include 'examples:ch22-react-rest'
